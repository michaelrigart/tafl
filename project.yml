name: Tafl
options:
  bundleIdPrefix: com.michaelrigart
  deploymentTarget:
    macOS: "27.0"
packages:
  TaflCore:
    path: Packages/TaflCore
  TaflPlatform27:
    path: Packages/TaflPlatform27
targets:
  Tafl:
    type: application
    platform: macOS
    sources: [Tafl]
    dependencies:
      - package: TaflCore
      - package: TaflPlatform27
    info:
      path: Tafl/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Tafl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Tafl/Tafl.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelrigart.tafl
        MARKETING_VERSION: dev
        CURRENT_PROJECT_VERSION: "0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
